<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Same mark as FlameMark in src/app/icons.jsx, using the index.css token values
       (navy-deep, card, lime, cobalt). Ring is thicker and fully opaque so it reads at 16 px. -->
  <defs>
    <radialGradient id="orb" cx="50%" cy="56%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#e6f234"/>
      <stop offset="1" stop-color="#0652d8"/>
    </radialGradient>
  </defs>
  <rect width="40" height="40" rx="10" fill="#131f6b"/>
  <circle cx="20" cy="20" r="11" fill="url(#orb)"/>
  <circle cx="20" cy="20" r="15" fill="none" stroke="#e6f234" stroke-width="2.6"/>
</svg>
